services:
  postgres:
    image: postgres:16
    container_name: etl-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    restart: unless-stopped
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: etl-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9200:9200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    container_name: etl-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    restart: unless-stopped

  init-data:
    image: alpine:3.20
    container_name: etl-init-data
    volumes:
      - airflow_data:/data
    command: sh -c "mkdir -p /data && chown -R 50000:0 /data"

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etl-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      API_URL: ${API_URL}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes:
      - airflow_logs:/opt/airflow/logs
      - airflow_data:/opt/airflow/data
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./elasticsearch:/opt/airflow/elasticsearch
      - ./plugins:/opt/airflow/plugins
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: bash /opt/airflow/scripts/start_airflow.sh
    restart: unless-stopped

volumes:
  postgres_data:
  elasticsearch_data:
  airflow_logs:
  airflow_data: